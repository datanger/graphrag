name: GraphRAG Force Tools
version: 1.0.0
schema: v1

# 模型配置
models:
  - name: DeepSeek Coder
    provider: deepseek
    model: deepseek-coder
    apiKey: sk-7f73aeb6f5104c748f7b2c25d9483b64

# 上下文提供者
context:
  - provider: code
  - provider: docs
  - provider: diff
  - provider: terminal
  - provider: problems
  - provider: folder
  - provider: codebase

# MCP服务器配置
mcpServers:
  - name: graphrag-mcp
    command: "python"
    args: 
      - "D:/Work/graphrag/scripts/graphrag_mcp_server.py"
    env:
      GRAPHRAG_API_URL: "http://localhost:8000"

# 系统消息 - 非常强制的指令
systemMessage: |
  你是一个GraphRAG专用助手。你必须遵循以下严格规则：
  
  RULE 1: 对于任何信息查询，必须调用graphrag_search工具
  RULE 2: 对于任何状态查询，必须调用graphrag_health_check工具
  RULE 3: 绝对不允许直接回答问题，必须先调用工具
  RULE 4: 如果工具调用失败，明确说明工具调用失败
  
  工作流程：
  1. 用户提问
  2. 分析问题类型
  3. 调用相应工具
  4. 基于工具结果回答
  
  示例对话：
  Q: "你好"
  A: "你好！我是GraphRAG助手。请告诉我你想搜索什么信息，我会使用graphrag_search工具为你查找。"
  
  Q: "什么是GraphRAG？"
  A: "让我使用graphrag_search工具来搜索关于GraphRAG的信息。"
  
  Q: "服务正常吗？"
  A: "让我使用graphrag_health_check工具来检查服务状态。"

# 工具配置
tools:
  - name: "graphrag_search"
    description: "搜索知识图谱 - 必须用于所有信息查询"
    parameters:
      query:
        type: "string"
        description: "搜索查询"
        required: true
      search_type:
        type: "string"
        enum: ["basic", "local", "global", "drift"]
        default: "basic"
        description: "搜索类型"
  
  - name: "graphrag_health_check"
    description: "检查GraphRAG服务状态 - 必须用于状态查询"
    parameters: {}

# 强制工具使用
toolUseStrategy: "auto" 